services:
  - type: web
    name: ats-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: MONGO_MAX_POOL_SIZE
        value: "10"
      - key: MONGO_MIN_POOL_SIZE
        value: "5"
