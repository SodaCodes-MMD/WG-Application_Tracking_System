name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend - Build and Test
    runs-on: ubuntu-latest
    
    # Optional: Spin up a MongoDB container for integration tests
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        run: npm install
      
      - name: Lint backend code
        run: npm run lint --workspace=@ats/backend
      
      - name: Build backend
        run: npm run build --workspace=@ats/backend
      
      - name: Run backend tests
        run: npm test --workspace=@ats/backend
  
  frontend:
    name: Frontend - Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      
      - name: Lint frontend code
        run: npm run lint --workspace=@ats/frontend
      
      - name: Build frontend
        run: npm run build --workspace=@ats/frontend
      
      - name: Run frontend tests
        run: npm test --workspace=@ats/frontend
  
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.backend.result }}" == "success" && "${{ needs.frontend.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ CI checks failed!"
            exit 1
          fi

